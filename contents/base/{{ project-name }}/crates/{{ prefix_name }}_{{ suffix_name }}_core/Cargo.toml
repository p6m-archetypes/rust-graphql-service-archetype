[package]
name = "{{ prefix_name }}_{{ suffix_name }}_core"
version.workspace = true
edition.workspace = true

[dependencies]
{{ prefix_name }}_{{ suffix_name }}_schema = { path = "../{{ prefix_name }}_{{ suffix_name }}_schema" }
{% if persistence ~= 'None' %}{{ prefix_name }}_{{ suffix_name }}_persistence = { path = "../{{ prefix_name }}_{{ suffix_name }}_persistence" }
{% endif %}{% if cache ~= 'None' %}{{ prefix_name }}_{{ suffix_name }}_cache = { path = "../{{ prefix_name }}_{{ suffix_name }}_cache" }
{% endif %}{% if messaging ~= 'None' %}{{ prefix_name }}_{{ suffix_name }}_messaging = { path = "../{{ prefix_name }}_{{ suffix_name }}_messaging" }
{% endif %}
anyhow = "1"
async-graphql = { version = "7", features = ["graphiql"] }
axum = { version = "0.8", features = ["macros"] }
http = "1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
